name: 功能建议
description: 提出一项边界明确的改进建议。
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请描述当前工作流中的具体困难，而不只是期望的界面样式。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 包含预期行为、边界情况和对现有播放流程的影响。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案（可选）
