<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="sidepanel.css">
    <title>B站听歌列表</title>
</head>
<body>
    <div class="player">
        <div class="np-bg" id="npBg"></div>
        <div class="np">
            <div class="cover-wrap"><img class="cover" id="npCover" alt="" referrerpolicy="no-referrer"></div>
            <div class="np-title t"><div class="track"><span class="txt" id="curTitle">未播放</span></div></div>
            <div class="np-ctrl">
                <button id="prevBtn" class="cbtn" title="上一首"><svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
                <button id="playBtn" class="cbtn main" title="播放/暂停"><svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M8 5v14l11-7z"/></svg></button>
                <button id="nextBtn" class="cbtn" title="下一首"><svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
                <button id="stopBtn" class="cbtn stop" title="停止播放"><svg viewBox="0 0 24 24" width="13" height="13"><path fill="currentColor" d="M6 6h12v12H6z"/></svg></button>
            </div>
        </div>
        <div class="progress">
            <input type="range" id="seek" min="0" value="0" step="1">
            <div class="time" id="time">0:00 / 0:00</div>
        </div>
        <div class="vrow">
            <button id="muteBtn" class="vbtn" title="静音/取消静音">🔊</button>
            <input type="range" id="volSlider" min="0" max="100" value="80" step="1">
            <button id="modeBtn" class="tbtn mode" title="切换播放模式"></button>
        </div>
    </div>

    <div class="listwrap">
        <div class="pl-bar">
            <select id="plSelect" title="切换歌单"></select>
            <button id="plNew" class="pbtn" title="新建歌单">＋</button>
            <button id="plMenuBtn" class="pbtn" title="歌单操作">⋯</button>
            <div id="plMenu" class="menu hidden">
                <div data-act="rename">重命名歌单</div>
                <div data-act="import">导入歌单 (JSON)</div>
                <div class="sep"></div>
                <div data-act="export-txt">导出为 TXT</div>
                <div data-act="export-md">导出为 Markdown</div>
                <div data-act="export-json">导出为 JSON</div>
                <div class="sep"></div>
                <div data-act="clear">清空歌单</div>
                <div data-act="delete" class="danger">删除歌单</div>
                <div class="sep"></div>
                <div data-act="log">查看运行日志</div>
                <div data-act="log-export">导出日志 (TXT)</div>
                <div data-act="log-clear">清空日志</div>
            </div>
        </div>
        <input type="file" id="importFile" accept=".json,application/json" style="display:none">
        <div class="selbar hidden" id="selBar">
            <span class="sel-count" id="selCount">已选 0 首</span>
            <div class="sel-acts">
                <button class="selbtn" id="selMoveBtn">移动至▾</button>
                <button class="selbtn" id="selCopyBtn">复制到▾</button>
                <button class="selbtn danger" id="selDelBtn">删除</button>
                <button class="selbtn" id="selCancelBtn">取消</button>
            </div>
            <div class="sel-menu hidden" id="selMenu"></div>
        </div>
        <div id="list" class="list"></div>
    </div>

    <div id="coverPop"><img id="coverPopImg" alt=""></div>
    <div id="diag" class="diag hidden"></div>
    <script src="theme.js"></script>
    <script src="logger.js"></script>
    <script src="sidepanel.js"></script>
</body>
</html>
